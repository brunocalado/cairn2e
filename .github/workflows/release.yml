# Pushing a tag like v0.2.0 publishes a GitHub Release with two files:
#
#   system.json   the manifest, stamped with the tag's version and this release's download URL
#   cairn2e.zip   the installable system, compendium packs built from packs/_source/ and the
#                 stylesheet built from css/src/
#
# Foundry installs from https://github.com/<owner>/cairn2e/releases/latest/download/system.json,
# which GitHub always redirects to the newest release's copy — so that one URL never changes.
#
# Once the GitHub Release exists, the version is also published to the package's page on
# foundryvtt.com, with the FOUNDRY_PACKAGE_TOKEN repository secret.
#
# The release notes are the tag's own `# X.Y.Z` section of CHANGELOG.md, everything up to the next
# `# ` heading. A tag with no section, or an empty one, fails here, before anything is published.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Take the release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '{ sub(/\r$/, "") } $0 == "# " v { f = 1; next } /^# / && f { exit } f' \
            CHANGELOG.md > release-notes.md
          if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
            echo "::error::CHANGELOG.md has no \"# $VERSION\" section. Write it, commit, and tag again."
            exit 1
          fi

      - run: npm ci

      # Validating against the DataModels needs a Foundry install, which a runner does not have.
      # The sources are validated locally by `npm run packs` before they are committed.
      - name: Build the compendium packs
        run: node tools/build-packs.mjs --no-validate

      # css/cairn2e.min.css is gitignored build output, like the packs: without this step the zip
      # ships a system with no stylesheet at all. No source map: it carries every source in full,
      # five times the stylesheet's size, for an inspector nobody opens on an installed system.
      - name: Build the stylesheet
        run: node tools/build-css.mjs --no-sourcemap

      - name: Stamp the manifest
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg version "${GITHUB_REF_NAME#v}" \
             --arg manifest "$REPO_URL/releases/latest/download/system.json" \
             --arg download "$REPO_URL/releases/download/$GITHUB_REF_NAME/cairn2e.zip" \
             --arg changelog "$REPO_URL/blob/$GITHUB_REF_NAME/CHANGELOG.md" \
             '.version = $version | .manifest = $manifest | .download = $download | .changelog = $changelog' \
             system.json > system.stamped.json
          mv system.stamped.json system.json

      # Only what the system loads, plus its licences and credits. packs/_source/ and css/src/ are
      # the editable forms and stay out: Foundry reads the built LevelDB and the built stylesheet.
      - name: Zip the system
        run: |
          zip -r cairn2e.zip \
            system.json module templates css lang assets fonts scenes packs \
            LICENSE README.md CHANGELOG.md docs/CREDITS.md \
            -x 'packs/_source/*' 'css/src/*'

      # The GitHub CLI already on the runner, not a third-party action: an action runs with this
      # job's contents: write token, and its tag can be repointed to other code with no change here.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" system.json cairn2e.zip \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      # Last, because foundryvtt.com fetches the manifest it is handed: this version's own copy,
      # not the latest/ redirect, and it only exists once the release above has its assets.
      # The token is the package's release token from its foundryvtt.com admin page, sent bare.
      - name: Publish to foundryvtt.com
        if: env.FOUNDRY_TOKEN != ''
        env:
          FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_PACKAGE_TOKEN }}
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg version "${GITHUB_REF_NAME#v}" \
             --arg manifest "$REPO_URL/releases/download/$GITHUB_REF_NAME/system.json" \
             --arg notes "$REPO_URL/releases/tag/$GITHUB_REF_NAME" \
             '{ id, release: { version: $version, manifest: $manifest, notes: $notes, compatibility } }' \
             system.json > payload.json
          curl -sS --fail-with-body -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Content-Type: application/json" -H "Authorization: $FOUNDRY_TOKEN" \
            --data @payload.json
